<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;900&family=Overpass+Mono:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root { --bg: #eef1ed; --surface: #f9fbf8; --sunk: #e3e8e2; --ink: #14201a; --muted: #56675d; --rule: #c6d1c9;
  --pub: #2b6cb0; --priv: #c2410c; --c-state: #0f7b6c;
  --display: "Overpass", "Arial Narrow", sans-serif; --body: "Atkinson Hyperlegible", "Segoe UI", sans-serif; --mono: "Overpass Mono", Consolas, monospace }
html, body { margin: 0; background: #ffffff } .wrap { width: 1000px; padding: 16px 20px 18px; background: #ffffff }
.legend { font: 12px var(--body); color: var(--muted); margin-top: 6px }

.sd { width: 100%; height: auto; display: block; font-family: var(--body) }
.sd .sd-box { fill: var(--surface); stroke: var(--rule); stroke-width: 1.2 }
.sd .sd-mini { fill: var(--bg); stroke: var(--rule) }
.sd .sd-out { fill: var(--sunk); stroke: var(--ink); stroke-width: 1.5 }
.sd .sd-ln { stroke: var(--ink); stroke-width: 1.4 } .sd .sd-head { fill: var(--ink) }
.sd text { fill: var(--ink) }
.sd .sd-h { font: 700 11px var(--display); letter-spacing: .08em; fill: var(--muted) }
.sd .sd-t { font: 700 13.5px var(--display) } .sd .sd-big { font: 900 18px var(--display) }
.sd .sd-m { font: 700 12px var(--display) } .sd .sd-s { font-size: 11.5px; fill: var(--muted) }
.sd .sd-a { font: 600 10px var(--mono); fill: var(--muted) }
.sd .sd-chip { font: 700 10px var(--mono) }
.sd .sd-c-train { fill: none; stroke: var(--muted) } .sd .sd-c-train-t { fill: var(--muted) }
.sd .sd-c-month { fill: none; stroke: var(--c-state) } .sd .sd-c-month-t { fill: var(--c-state) }
.sd .sd-c-online { fill: none; stroke: var(--pub) } .sd .sd-c-online-t { fill: var(--pub) }
.sd .sd-c-m4a { fill: none; stroke: var(--priv) } .sd .sd-c-m4a-t { fill: var(--priv) }

="M578,118.0 L602,118.0" class="sd-ln" fill="none" marker-end="url(#sd-arr)"/><text x="590.0" y="112.0" class="sd-a" text-anchor="middle">rows</text><rect x="240" y="194" width="524" height="34" rx="6" class="sd-box" stroke-dasharray="5 4"/><text x="252" y="216" class="sd-t" text-anchor="start">Task 3 · physics · 15%</text><text x="412" y="216" class="sd-s" text-anchor="start">no model of its own: scored on our Task 1 speed and flow</text><path d="M502,172 L502,192" class="sd-ln" fill="none" marker-end="url(#sd-arr)"/><text x="510" y="186" class="sd-a" text-anchor="start">scored on</text><rect x="240" y="244" width="524" height="106" rx="6" class="sd-box"/><text x="252" y="265" class="sd-t" text-anchor="start">Task 2 · onset · 15%</text><rect x="723" y="252" width="31" height="17" rx="3" class="sd-c-online"/><text x="738" y="264.5" class="sd-chip sd-c-online-t" text-anchor="middle">≤ T</text><rect x="673" y="252" width="44" height="17" rx="3" class="sd-c-train"/><text x="695" y="264.5" class="sd-chip sd-c-train-t" text-anchor="middle">train</text><rect x="252" y="278" width="148" height="62" rx="4" class="sd-mini"/><text x="261" y="296" class="sd-m" text-anchor="start">Q03 site classifier</text><text x="261" y="312" class="sd-s" text-anchor="start">LightGBM on online</text><text x="261" y="326" class="sd-s" text-anchor="start">precursors</text><rect x="428" y="278" width="148" height="62" rx="4" class="sd-mini"/><text x="437" y="296" class="sd-m" text-anchor="start">Q0436 switches</text><text x="437" y="312" class="sd-s" text-anchor="start">calibrated on the</text><text x="437" y="326" class="sd-s" text-anchor="start">window&#x27;s own history</text><rect x="604" y="278" width="148" height="62" rx="4" class="sd-mini"/><text x="613" y="296" class="sd-m" text-anchor="start">Expected-IoU decode</text><text x="613" y="312" class="sd-s" text-anchor="start">top site, or top two</text><text x="613" y="326" class="sd-s" text-anchor="start">if odds ratio ≥ .8</text><path d=" ="M578,427.0 L602,427.0" class="sd-ln" fill="none" marker-end="url(#sd-arr)"/><text x="590.0" y="421.0" class="sd-a" text-anchor="middle">probs</text><rect x="240" y="480" width="524" height="60" rx="6" class="sd-box"/><text x="252" y="501" class="sd-t" text-anchor="start">Task 4 · ODME · 20%</text><rect x="710" y="488" width="44" height="17" rx="3" class="sd-c-month"/><text x="732" y="500.5" class="sd-chip sd-c-month-t" text-anchor="middle">month</text><text x="252" y="526" class="sd-s" text-anchor="start">the organiser&#x27;s NNLS: min ‖Af − c‖² + .05 ‖f − b‖², f ≥ 0, on the month&#x27;s counts c and prior b</text><rect x="800" y="40" width="184" height="500" rx="6" class="sd-out"/><text x="892" y="70" class="sd-big" text-anchor="middle">Submission</text><text x="892" y="90" class="sd-s" text-anchor="middle">C79 · the scored file</text><path d="M764,106 L808,106" class="sd-ln" fill="none" marker-end="url(#sd-arr)"/><text x="816" y="110" class="sd-m" text-anchor="start">state rows</text><path d="M764,297 L808,297" class="sd-ln" fill="none" marker-end="url(#sd-arr)"/><text x="816" y="301" class="sd-m" text-anchor="start">onset rows</text><path d="M764,415 L808,415" class="sd-ln" fill="none" marker-end="url(#sd-arr)"/><text x="816" y="419" class="sd-m" text-anchor="start">ongoing rows</text><path d="M764,510 L808,510" class="sd-ln" fill="none" marker-end="url(#sd-arr)"/><text x="816" y="514" class="sd-m" text-anchor="start">ODME rows</text><text x="892" y="160" class="sd-t" text-anchor="middle">public .90088</text><text x="892" y="182" class="sd-t" text-anchor="middle">private .89874</text><text x="892" y="204" class="sd-s" text-anchor="middle">8th of 802 teams</text><text x="892" y="236" class="sd-s" text-anchor="middle">March and April rows</text><text x="892" y="252" class="sd-s" text-anchor="middle">built separately</text><text x="16" y="568" class="sd-h" text-anchor="start">HOW A PIECE GOT IN</text><rect x="16" y="578" width="180" height="48" rx="6" class="sd-box"/><text x="28" y="598" class="sd-m" text-anchor="start">Idea</text><text x="28" y="615" class="sd-s" text-anchor="start">registry: 267 tested</text><rect x="213" y="578" width="180" height="48" rx="6" class="sd-box"/><text x="225" y="598" class="sd-m" text-anchor="start">Offline instrument</text><text x="225" y="615" class="sd-s" text-anchor="start">hides cells of the month</text><rect x="410" y="578" width="180" height="48" rx="6" class="sd-box"/><text x="422" y="598" class="sd-m" text-anchor="start">Written forecast</text><text x="422" y="615" class="sd-s" text-anchor="start">and band, before upload</text><rect x="607" y="578" width="180" height="48" rx="6" class="sd-box"/><text x="619" y="598" class="sd-m" text-anchor="start">Board read</text><text x="619" y="615" class="sd-s" text-anchor="start">5 a day, method only</text><rect x="804" y="578" width="180" height="48" rx="6" class="sd-box"/><text x="816" y="598" class="sd-m" text-anchor="start">Adopt or refute</text><text x="816" y="615" class="sd-s" text-anchor="start">45 pieces adopted</text><path d="M198,602 L211,602" class="sd-ln" fill="none" marker-end="url(#sd-arr)"/><path d="M395,602 L408,602" class="sd-ln" fill="none" marker-end="url(#sd-arr)"/><path d="M592,602 L605,602" class="sd-ln" fill="none" marker-end="url(#sd-arr)"/><path d="M789,602 L802,602" class="sd-ln" fill="none" marker-end="url(#sd-arr)"/><path d="M894,578 L894,560 L502,560 L502,542" class="sd-ln" fill="none" marker-end="url(#sd-arr)"/><text x="698" y="554" class="sd-a" text-anchor="middle">adds a piece to an engine</text><text x="16" y="652" class="sd-h" text-anchor="start">REBUILD FROM THE PUBLIC REPOSITORY (CLEAN FOLDER, 9 NOVEMBER 2026)</text><rect x="16" y="662" width="180" height="48" rx="6" class="sd-box"/><text x="28" y="682" class="sd-m" text-anchor="start">Public inputs</text><text x="28" y="699" class="sd-s" text-anchor="start">repo, weights-v1, data</text><rect x="213" y="662" width="180" height="48" rx="6" class="sd-box"/><text x="225" y="682" class="sd-m" text-anchor="start">Base build C47</text><text x="225" y="699" class="sd-s" text-anchor="start">WSL, about 3.5 h</text><rect x="410" y="662" width="180" height="48" rx="6" class="sd-box"/><text x="422" y="682" class="sd-m" text-anchor="start">17 pieces</text><text x="422" y="699" class="sd-s" text-anchor="start">rows 19 to 35, 12 h CPU</text><rect x="607" y="662" width="180" height="48" rx="6" class="sd-box"/><text x="619" y="682" class="sd-m" text-anchor="start">Per-step check</text><text x="619" y="699" class="sd-s" text-anchor="start">sha256 against development</text><rect x="804" y="662" width="180" height="48" rx="6" class="sd-box"/><text x="816" y="682" class="sd-m" text-anchor="start">C79 and C80</text><text x="816" y="699" class="sd-s" text-anchor="start">byte-equal to stored files</text><path d="M198,686 L211,686" class="sd-ln" fill="none" marker-end="url(#sd-arr)"/><path d="M395,686 L408,686" class="sd-ln" fill="none" marker-end="url(#sd-arr)"/><path d="M592,686 L605,686" class="sd-ln" fill="none" marker-end="url(#sd-arr)"/><path d="M789,686 L802,686" class="sd-ln" fill="none" marker-end="url(#sd-arr)"/></svg>
